<div class="col-md-6 offset-md-3">
    <div class="text-center">
        <h3 class="form-title">Add Project</h3>
    </div>

    <form (ngSubmit)="addProject()">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" [(ngModel)]="projectRequest.title" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="form-group">
            <label for="dueAt">Due Date</label>
            <input type="date" class="form-control" id="dueAt" [(ngModel)]="dueDate" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="text-center">
            <button class="btn btn-primary" type="submit">Add</button>
        </div>
        
    </form>

</div>
