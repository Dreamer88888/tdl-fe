<div class="col-md-6 offset-md-3">
    <div class="text-center">
        <h3 class="form-titme">Update Project</h3>
    </div>

    <form (ngSubmit)="updateProject()" class="container">
        <div class="form-group mt-3 mb-3">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" [(ngModel)]="projectResponse.project.title" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="form-group mt-3 mb-3">
            <label for="dueAt">Due Date</label>
            <input type="date" class="form-control" id="dueAt" [(ngModel)]="dueDate" [ngModelOptions]="{standalone: true}" >
        </div>
        <div class="form-group mt-3 mb-3">
            <label for="progress">Progress</label>
            <select name="progress" id="progress" [(ngModel)]="projectResponse.project.progress" class="form-select" [ngModelOptions]="{standalone: true}" >
                <option value="To Do">To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Done">Done</option>
            </select>
        </div>
        
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <button class="btn btn-info" type="submit">Update</button>
                </div>
            </div>
        </div>
    </form>

</div>
